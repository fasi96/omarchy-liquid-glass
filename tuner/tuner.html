<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Glass Tuner</title>
<style>
  :root {
    --bg: #0d0e12; --panel: #15171d; --line: #262a33; --text: #e6e8ee; --muted: #8a90a0;
    --accent: #7dd3fc; --accent2: #c084fc; --good: #86efac; --warn: #fca5a5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.35 "JetBrainsMono Nerd Font", ui-monospace, monospace; }
  body { padding: 14px 14px 160px; }
  h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .02em; }
  .sub { color: var(--muted); margin-bottom: 12px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px 4px; margin-bottom: 10px; }
  section .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    section h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--accent);
    margin: 0; }
  .row { margin-bottom: 9px; }
  .row .top { display: flex; justify-content: space-between; gap: 8px; }
  .row label { cursor: default; }
  .row .val { color: var(--accent2); font-variant-numeric: tabular-nums; }
  .row .hint { color: var(--muted); font-size: 11px; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 3px 0 0; }
  .toggle { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
  select, input[type=color] { background: #1d2028; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 6px; font: inherit; }
  input[type=color] { padding: 0; width: 44px; height: 26px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(13,14,18,.96);
    border-top: 1px solid var(--line); padding: 10px 14px; display: grid; gap: 8px;
    grid-template-columns: 1fr 1fr; }
  button { font: inherit; color: var(--text); background: #1d2028; border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 6px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: linear-gradient(90deg, #0e7490, #7c3aed); border: 0; font-weight: 700; }
  button.compare { grid-column: 1 / -1; }
  button.compare:active, button.compare.held { background: var(--accent2); color: #000; }
  .status { grid-column: 1 / -1; color: var(--muted); font-size: 11px; min-height: 14px; }
  .looks-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 8px; }
  .looks-row.two { grid-template-columns: 1fr 1fr; }
  #look-name { background: #1d2028; color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 8px; font: inherit; min-width: 0; }
  #looks-box .hint { color: var(--muted); font-size: 11px; margin-bottom: 8px; }
  .dirty { color: var(--accent2); font-size: 11px; }
  .status.ok { color: var(--good); } .status.err { color: var(--warn); }
  .group { margin: 18px 0 8px; }
  .group-title { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--accent2); }
  .group-sub { color: var(--muted); font-size: 11px; margin: 2px 0 8px; }
  details.action { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
  details.action > summary { list-style: none; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; cursor: pointer; user-select: none; }
  details.action > summary::-webkit-details-marker { display: none; }
  details.action > summary .name::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--muted);
    transition: transform .15s; }
  details.action[open] > summary .name::before { transform: rotate(90deg); }
  details.action .name { font-weight: 700; }
  details.action.off .name { color: var(--muted); }
  details.action .body { padding: 0 12px 4px; border-top: 1px solid var(--line); }
  details.action.off .body { opacity: .5; }
  details.action .tools { display: flex; justify-content: flex-end; margin: 8px 0 4px; }
  button.revert { padding: 2px 8px; font-size: 11px; color: var(--muted); }
  .sw { width: 38px; height: 22px; border-radius: 11px; background: #2a2e38; position: relative; flex: none;
    transition: background .15s; cursor: pointer; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
    background: #c9ccd6; transition: left .15s; }
  .sw.on { background: linear-gradient(90deg, #0e7490, #7c3aed); }
  .sw.on::after { left: 19px; background: #fff; }
</style>
</head>
<body>
<h1>Glass Tuner</h1>
<div class="sub">Changes show live. Double-click a slider to reset it. Nothing is saved until you press Save.</div>
<section id="looks-box">
  <div class="head"><h2>Saved looks</h2><span class="dirty" id="dirty"></span></div>
  <div class="toggle"><select id="looks" style="flex:1"></select></div>
  <div class="looks-row two">
    <button id="look-update" title="Overwrite the selected look with the current sliders">Update</button>
    <button id="look-delete" title="Delete the selected look">Delete</button>
  </div>
  <div class="looks-row">
    <input id="look-name" maxlength="40" placeholder="Name, e.g. Apple glass">
    <button id="look-new">Save as new</button>
  </div>
  <div class="hint" id="look-active"></div>
</section>
<div id="ui"></div>

<div class="bar">
  <button class="compare" id="compare">Hold to compare: glass off</button>
  <button class="compare" id="apple">Load Apple-ish starting point</button>
  <button id="test">Open test window</button>
  <button id="wall">Next wallpaper</button>
  <button id="revert">Revert to saved</button>
  <button class="primary" id="save">Save</button>
  <div class="status" id="status"></div>
</div>

<script>
// Main glass settings: always-open cards. Actions: collapsible, each with an
// on/off switch in its header (`action` = its switch key).
const SECTIONS = [
  { title: 'Thick glass rim', rows: [
    ['edge_thickness', 'Rim width', 'How wide the thick glass edge is (share of the window size)'],
    ['refraction_strength', 'Edge bend', 'How hard it bends at the edges. Below 0 bends outward'],
    ['chromatic_aberration', 'Rainbow fringe', 'Colour split where the glass bends'],
    ['fresnel_strength', 'Edge glow', 'Light caught all around the rim'],
    ['specular_strength', 'Top highlight', 'Shine along the top of the rim'],
  ]},
  { title: 'Edge shape', edge: true, rows: [
    ['refraction_spread', 'Bend depth', '1 = bends across the whole window, 0 = only a rim with a flat middle'],
    ['refraction_flow', 'Bend along edges', '0 = pulls toward the middle, 1 = slides along the edges'],
    ['fresnel_tint', 'Edge glow colour', '0 = white, 1 = picks up the colours behind the glass'],
    ['specular_angle', 'Highlight direction', 'Where the top highlight comes from: 0 top, 90 right, 180 bottom, 270 left'],
    ['self_sample', 'Own text in the glass', "Mixes the terminal's own content into the glass behind it. 0 = off"],
  ]},
  { title: 'Glass edge line', edge: true, rows: [
    ['bevel_strength', 'Line', 'A thin lit line along the glass edge. 0 = none'],
    ['bevel_size', 'Thickness', 'px'],
    ['bevel_angle', 'Light direction', '0 top, 90 right, 180 bottom, 270 left'],
    ['bevel_shadow', 'Shadow side', 'Darker on the side away from the light'],
    ['bevel_tint', 'Colour from behind', '0 = its own colour, 1 = the colours behind the glass'],
  ], extra: ['bevel_color', 'Line colour'] },
  { title: 'Glass body', rows: [
    ['lens_distortion', 'Lens dome', 'Magnifies the middle like a lens'],
  ]},
  { title: 'Blur', rows: [
    ['blur_strength', 'Blur', 'Less blur makes the bending easier to see'],
    ['blur_iterations', 'Blur passes', 'Smoothness of the blur'],
  ]},
  { title: 'Tone', rows: [
    ['brightness', 'Brightness', ''],
    ['contrast', 'Contrast', ''],
    ['adaptive_dim', 'Dim bright spots', 'Keeps text readable over bright wallpaper'],
    ['adaptive_boost', 'Lift dark spots', 'Milky glass over dark wallpaper'],
  ]},
  { title: 'Colour', rows: [
    ['saturation', 'Saturation', 'Colour of the wallpaper through the glass'],
    ['vibrancy', 'Vibrancy', 'Extra pop for colourful areas'],
    ['vibrancy_darkness', 'Vibrancy in shadows', ''],
    ['tint_strength', 'Tint strength', 'How much of the tint colour is mixed in'],
    ['glass_opacity', 'Glass amount', 'Overall strength of the whole effect'],
  ], extra: ['tint', 'Tint colour'] },
  { title: 'Text', rows: [
    ['text_boost', 'Text brightness', "Brightens your theme's own text colour toward white, so it still follows theme changes. 0 = exactly the theme colour. Updates open terminals"],
  ], choices: [['font_weight', 'Font weight', ['regular', 'medium', 'semibold', 'bold'], 'Heavier letters hold up better on glass. New terminals, after Save']],
    toggles: [['bold_bright', 'Bold text in bright colours (new terminals, after Save)']] },
  { title: 'Window look', rows: [
    ['foot_alpha', 'Terminal background', '0 = pure glass, 1 = solid black (updates open terminals)'],
    ['foot_pad', 'Text padding', 'Space between text and the window edge, so text stays off the rim. Applies to new terminals after Save; the test window button uses it'],
    ['rounding', 'Corner rounding', ''],
    ['gaps_in', 'Gap between windows', ''],
    ['gaps_out', 'Gap to screen edge', ''],
  ], toggles: [['glass_on', 'Liquid Glass on terminals'], ['shadow', 'Shadows']] },
  { title: 'Outer line (flat border)', rows: [
    ['border_size', 'Line thickness', 'A thin lit lip outside the glass. 0 = none'],
    ['rim_lit', 'Lit corner', 'Brightness where the light hits'],
    ['rim_side', 'Sides', 'Brightness along the edges in between'],
    ['rim_far', 'Far corner', 'Soft reflection on the opposite corner'],
    ['rim_angle', 'Light direction', '45 top-left, 135 top-right, 225 bottom-right, 315 bottom-left'],
    ['rim_inactive', 'Unfocused windows', 'How much rim unfocused windows keep'],
  ], extra: ['rim_color', 'Rim colour'],
    toggles: [['glass_border', 'Lit white line (off = neon gradient)'], ['border_spin', 'Spin the light around']] },

  { group: 'Actions', light: true, rows: [
    ['light_lag', 'Cursor smoothing', 'Shared by Light and Parallax: seconds they take to catch up with your pointer. 0 = instant'],
  ]},
  { title: 'Light follows you', action: 'light_on', light: true, rows: [
    ['light_strength', 'Light', 'Light added where the rim faces the light. 0 = no light, the glass still bends'],
    ['light_cursor', 'Follows cursor', 'How far the light leans toward your pointer'],
    ['light_x', 'Light left / right', 'Across all monitors: 0 = left edge, 1 = right edge'],
    ['light_y', 'Light height', '0 = top of the screens, below 0 = above them. Closer = highlights move more'],
    ['light_sharpness', 'Highlight focus', 'Higher = a tighter, shinier highlight'],
    ['light_width', 'Depth', 'How far into the glass the rim light reaches, px'],
    ['light_far', 'Back reflection', 'Soft light on the side facing away'],
    ['light_bend', 'Bend', 'How much the glass bends where it faces the light. 0 = light only'],
    ['light_inactive', 'Unfocused windows', 'How much light unfocused windows catch'],
  ], extra: ['light_color', 'Light colour'] },
  { title: 'Parallax tilt', action: 'parallax_on', light: true, rows: [
    ['parallax_strength', 'Tilt', 'How far the view behind the glass shifts as your pointer moves, px'],
    ['parallax_depth', 'Thickness', 'Extra shift toward the rim, so the glass reads as thick'],
  ]},
  { title: 'Oil film', action: 'oil_on', light: true, rows: [
    ['oil_amount', 'Amount', 'Slow iridescent swirls on the glass, like oil on water'],
    ['oil_speed', 'Flow speed', ''],
    ['oil_scale', 'Swirl size', 'px'],
    ['oil_color', 'Colour', '0 = clear sheen, 1 = full rainbow film'],
    ['oil_warp', 'Ripple', 'How much the film ripples the view behind the glass'],
    ['oil_inactive', 'Unfocused windows', '0 = only the focused window flows (lighter on the GPU)'],
    ['oil_fps', 'Smoothness', 'Redraws per second while it flows. Lower = lighter on the GPU'],
  ]},
  { title: 'Click glow', action: 'glow_on', light: true, rows: [
    ['glow_strength', 'Light', 'Light that spreads from where you click. 0 = no light, the glass still flexes'],
    ['glow_duration', 'Duration', 'Seconds to spread and fade'],
    ['glow_spread', 'Spread', 'How far it travels (share of the window)'],
    ['glow_ring', 'Ring width', 'px'],
    ['glow_flex', 'Flex', 'How much the glass flexes as the ripple passes. 0 = light only'],
  ]},
  { title: 'Materialize', action: 'materialize_on', light: true, rows: [
    ['materialize_duration', 'Duration', 'New windows appear by bending in, not fading. Seconds'],
  ]},
  { title: 'Drift', action: 'drift_on', light: true, rows: [
    ['light_drift', 'Amount', 'The light slowly wanders on its own, so highlights creep round the rims'],
    ['light_drift_period', 'Time', 'Seconds for one slow wander'],
  ]},
];

// which action cards are open (per-viewer convenience; fine if storage is unavailable)
const OPEN_KEY = 'glass-tuner-open';
function openSet() { try { return new Set(JSON.parse(localStorage.getItem(OPEN_KEY) || '[]')); } catch (e) { return new Set(); } }
function saveOpen(set) { try { localStorage.setItem(OPEN_KEY, JSON.stringify([...set])); } catch (e) {} }

let S = {}, SAVED = {}, META = {}, timer = null, compare = false;
const $ = id => document.getElementById(id);
const range = k => (META.glass[k] || META.look[k]);
const isInt = k => ['specular_angle', 'bevel_angle', 'oil_scale', 'oil_fps', 'light_width', 'glow_ring', 'foot_pad', 'blur_iterations', 'tint_strength', 'rounding', 'gaps_in', 'gaps_out', 'border_size', 'rim_angle'].includes(k);

function status(msg, cls = '') { const el = $('status'); el.textContent = msg; el.className = 'status ' + cls; }

function push() {
  markDirty();
  clearTimeout(timer);
  timer = setTimeout(() => fetch('/apply', { method: 'POST', body: JSON.stringify({ state: S, compare }) }), 40);
}

function fmt(k, v) { return isInt(k) ? String(Math.round(v)) : Number(v).toFixed(k === 'edge_thickness' ? 3 : 2); }

function sliderRow(k, label, hint) {
  const [lo, hi] = range(k);
  const r = document.createElement('div'); r.className = 'row';
  r.innerHTML = `<div class="top"><label>${label}</label><span class="val"></span></div>`
    + (hint ? `<div class="hint">${hint}</div>` : '');
  const inp = document.createElement('input');
  Object.assign(inp, { type: 'range', min: lo, max: hi, step: isInt(k) ? 1 : (hi - lo) / 200, value: S[k] });
  const val = r.querySelector('.val');
  const show = () => { val.textContent = fmt(k, S[k]); };
  inp.oninput = () => { S[k] = parseFloat(inp.value); show(); push(); };
  inp.ondblclick = () => { S[k] = META.defaults[k]; inp.value = S[k]; show(); push(); };
  show(); r.appendChild(inp);
  return r;
}

function fillSection(el, sec) {
  for (const [k, label, hint] of sec.rows) el.appendChild(sliderRow(k, label, hint));
  for (const [key, label, options, hint] of sec.choices || []) {
    const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = `<div class="top"><label>${label}</label></div>` + (hint ? `<div class="hint">${hint}</div>` : '');
    const sel = document.createElement('select'); sel.style.width = '100%'; sel.style.marginTop = '4px';
    for (const o of options) sel.add(new Option(o[0].toUpperCase() + o.slice(1), o));
    sel.value = S[key];
    sel.onchange = () => { S[key] = sel.value; push(); };
    r.appendChild(sel); el.appendChild(r);
  }
  if (sec.extra) {
    const [key, label] = sec.extra;
    const r = document.createElement('div'); r.className = 'toggle';
    r.innerHTML = `<label>${label}</label>`;
    const c = document.createElement('input'); c.type = 'color'; c.value = '#' + S[key];
    c.oninput = () => { S[key] = c.value.slice(1); push(); };
    r.appendChild(c); el.appendChild(r);
  }
  for (const [k, label] of sec.toggles || []) {
    const r = document.createElement('div'); r.className = 'toggle';
    r.innerHTML = `<label>${label}</label>`;
    const c = document.createElement('input'); c.type = 'checkbox'; c.checked = S[k];
    c.onchange = () => { S[k] = c.checked; push(); };
    r.appendChild(c); el.appendChild(r);
  }
}

function revertButton(sec, label) {
  const btn = document.createElement('button');
  btn.className = 'revert'; btn.textContent = 'Revert';
  btn.title = 'Put this section back to your saved values';
  btn.onclick = e => {
    e.preventDefault(); e.stopPropagation();
    const keys = sec.rows.map(r => r[0]).concat((sec.toggles || []).map(t => t[0]), (sec.choices || []).map(c => c[0]),
      sec.extra ? [sec.extra[0]] : [], sec.action ? [sec.action] : []);
    for (const k of keys) S[k] = SAVED[k];
    build(); push(); status(`${label} back to saved`, 'ok');
  };
  return btn;
}

function build() {
  const ui = $('ui'); ui.innerHTML = '';
  const open = openSet();
  for (const sec of SECTIONS) {
    if (sec.light && !META.light) continue;   // patched build not loaded
    if (sec.edge && !META.edge) continue;     // plugin older than hyprglass v0.9.0

    if (sec.group) {                           // a heading plus shared settings
      const g = document.createElement('div'); g.className = 'group';
      g.innerHTML = `<div class="group-title">${sec.group}</div><div class="group-sub">Each one turns on and off by itself. Click a name to open its settings.</div>`;
      const box = document.createElement('section'); fillSection(box, sec);
      g.appendChild(box); ui.appendChild(g);
      continue;
    }

    if (sec.action) {                          // collapsible card with an on/off switch
      const d = document.createElement('details'); d.className = 'action';
      d.open = open.has(sec.action);
      d.classList.toggle('off', !S[sec.action]);
      const sum = document.createElement('summary');
      const name = document.createElement('span'); name.className = 'name'; name.textContent = sec.title;
      const sw = document.createElement('span');
      sw.className = 'sw' + (S[sec.action] ? ' on' : ''); sw.setAttribute('role', 'switch');
      sw.setAttribute('aria-checked', S[sec.action] ? 'true' : 'false'); sw.title = 'Turn on or off';
      sw.onclick = e => {                       // flip the action, don't open/close the card
        e.preventDefault(); e.stopPropagation();
        S[sec.action] = !S[sec.action];
        sw.classList.toggle('on', S[sec.action]); sw.setAttribute('aria-checked', S[sec.action] ? 'true' : 'false');
        d.classList.toggle('off', !S[sec.action]);
        push(); status(`${sec.title}: ${S[sec.action] ? 'on' : 'off'}`);
      };
      sum.append(name, sw);
      d.appendChild(sum);
      const body = document.createElement('div'); body.className = 'body';
      const tools = document.createElement('div'); tools.className = 'tools';
      tools.appendChild(revertButton(sec, sec.title));
      body.appendChild(tools);
      fillSection(body, sec);
      d.appendChild(body);
      d.ontoggle = () => { const s = openSet(); d.open ? s.add(sec.action) : s.delete(sec.action); saveOpen(s); };
      ui.appendChild(d);
      continue;
    }

    const el = document.createElement('section');
    const head = document.createElement('div'); head.className = 'head';
    const h2 = document.createElement('h2'); h2.textContent = sec.title;
    head.append(h2, revertButton(sec, sec.title));
    el.appendChild(head);
    fillSection(el, sec);
    ui.appendChild(el);
  }
}

// ---------------- named looks ----------------
let LOOKS = { looks: {}, active: null };
const same = (a, b) => a && b && Object.keys(b).every(k => a[k] === b[k]);

function markDirty() {
  const sel = $('looks').value;
  $('dirty').textContent = sel && !same(S, LOOKS.looks[sel]) ? '• changed since loaded' : '';
}

function renderLooks(keep) {
  const sel = $('looks'); const want = keep ?? sel.value;
  sel.innerHTML = '';
  sel.add(new Option('— pick a look —', ''));
  for (const name of Object.keys(LOOKS.looks).sort()) sel.add(new Option(name + (name === LOOKS.active ? '  (saved as active)' : ''), name));
  sel.value = want in LOOKS.looks ? want : '';
  $('look-active').textContent = LOOKS.active ? `Active after reboot: ${LOOKS.active}` : 'Active after reboot: unnamed settings';
  markDirty();
}

$('looks').onchange = () => {
  const name = $('looks').value;
  if (!name) return markDirty();
  S = { ...S, ...LOOKS.looks[name] }; build(); push();
  status(`Loaded "${name}". Press Save to make it the active look.`);
};
async function lookPost(path, body) {
  const r = await fetch(path, { method: 'POST', body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) { status(j.error || 'Something went wrong', 'err'); return null; }
  LOOKS = j; return j;
}
$('look-new').onclick = async () => {
  const name = $('look-name').value.trim();
  if (!name) return status('Type a name first', 'err');
  if (name in LOOKS.looks && !confirm(`"${name}" exists. Overwrite it?`)) return;
  if (await lookPost('/looks/save', { name, state: S })) { $('look-name').value = ''; renderLooks(name); status(`Saved look "${name}"`, 'ok'); }
};
$('look-update').onclick = async () => {
  const name = $('looks').value;
  if (!name) return status('Pick a look to update first', 'err');
  if (await lookPost('/looks/save', { name, state: S })) { renderLooks(name); status(`Updated "${name}"`, 'ok'); }
};
$('look-delete').onclick = async () => {
  const name = $('looks').value;
  if (!name) return status('Pick a look to delete first', 'err');
  if (!confirm(`Delete the look "${name}"?`)) return;
  if (await lookPost('/looks/delete', { name })) { renderLooks(''); status(`Deleted "${name}"`, 'ok'); }
};

async function load() {
  const r = await (await fetch('/state')).json();
  S = r.state; SAVED = { ...r.state }; META = r.meta; build();
  LOOKS = await (await fetch('/looks')).json();
  renderLooks(LOOKS.active || '');
}

const cmp = $('compare');
const hold = on => { compare = on; cmp.classList.toggle('held', on); push(); };
cmp.onmousedown = () => hold(true);
addEventListener('mouseup', () => compare && hold(false));

// Found by eye on a floating 1100x700 terminal: thick bending edge, low blur,
// soft bright rim. Everything else stays where the sliders are.
const APPLE = { blur_strength: 0.5, refraction_strength: 3, edge_thickness: 0.07, lens_distortion: 3,
  chromatic_aberration: 1, fresnel_strength: 2, specular_strength: 3, foot_alpha: 0.25, adaptive_dim: 0.3,
  foot_pad: 40, border_size: 1, rim_lit: 0.55, rim_side: 0.05, rim_far: 0.25 };
$('apple').onclick = () => { Object.assign(S, APPLE); build(); push(); status('Apple-ish values loaded. Save to keep them.'); };
$('test').onclick = () => { fetch('/test-window', { method: 'POST', body: JSON.stringify({ state: S }) }); status('Opening a floating test terminal…'); };
$('wall').onclick = () => { fetch('/wallpaper', { method: 'POST', body: '{}' }); status('Next wallpaper'); };
$('revert').onclick = async () => {
  const r = await (await fetch('/revert', { method: 'POST', body: '{}' })).json();
  S = r.state; SAVED = { ...r.state }; build(); status('Back to your saved settings', 'ok');
};
$('save').onclick = async () => {
  status('Saving…');
  const sel = $('looks').value;
  const look = sel && same(S, LOOKS.looks[sel]) ? sel : null;
  const r = await (await fetch('/save', { method: 'POST', body: JSON.stringify({ state: S, look }) })).json();
  SAVED = { ...S };
  LOOKS = await (await fetch('/looks')).json(); renderLooks(sel);
  r.errors ? status('Saved, but Hyprland reported: ' + r.errors, 'err') : status('Saved to liquid_glass.lua and foot.ini', 'ok');
};
