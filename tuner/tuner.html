<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Glass Tuner</title>
<style>
  :root {
    --bg: #111318; --panel: #181b22; --raise: #1f232c; --line: #2a2f3a; --line2: #3a4150;
    --text: #e6e8ee; --muted: #8b91a1; --accent: #7dd3fc; --accent-ink: #06202b;
    --good: #86efac; --warn: #fca5a5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.4 "Inter", system-ui, sans-serif;
    display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 11px 18px;
    border-bottom: 1px solid var(--line); }
  h1 { font-size: 14px; font-weight: 600; margin: 0; }
  .master { display: flex; align-items: center; gap: 10px; color: var(--muted); }

  main { display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
  .col { min-height: 0; overflow: auto; padding: 12px 18px; scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
  .left { border-right: 1px solid var(--line); }
  h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    margin: 0 0 8px; display: flex; align-items: center; gap: 8px; min-height: 24px; }
  h2 .grow { flex: 1; }

  .row { margin-bottom: 10px; }
  .row .top { display: flex; justify-content: space-between; gap: 8px; }
  .val { color: var(--muted); font-variant-numeric: tabular-nums; }
  .hint { color: var(--muted); font-size: 11.5px; }
  input[type=range] { width: 100%; margin: 4px 0 0; accent-color: var(--accent); }
  .check { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; min-height: 26px; }
  .check input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
  select, input[type=color], input[type=text] { background: var(--raise); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 8px; font: inherit; }
  input[type=color] { padding: 0; width: 44px; height: 26px; }

  button { font: inherit; color: var(--text); background: var(--raise); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 12px; cursor: pointer; }
  button:hover { border-color: var(--line2); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.on { border-color: var(--accent); color: var(--accent); }
  button.small { padding: 3px 9px; font-size: 12px; color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 400; }

  .sw { width: 36px; height: 20px; border-radius: 10px; background: #2c313c; position: relative; flex: none;
    transition: background .15s; cursor: pointer; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%;
    background: #c9ccd6; transition: left .15s; }
  .sw.on { background: var(--accent); }
  .sw.on::after { left: 19px; background: #fff; }

  /* looks */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { padding: 5px 11px; border-radius: 999px; }
  .chip .tag { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .chip.on .tag { color: inherit; opacity: .75; }
  .looks-new { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .looks-new input { min-width: 0; }
  .dirty { color: var(--accent); text-transform: none; letter-spacing: 0; font-weight: 400; }

  /* effects list */
  .fxrow { display: grid; grid-template-columns: 36px 1fr auto 12px; gap: 12px; align-items: center;
    padding: 6px 10px; margin: 0 -10px; border-radius: 8px; cursor: pointer; }
  .fxrow:hover { background: var(--panel); }
  .fxrow b { font-weight: 600; display: block; }
  .fxrow .sub { color: var(--muted); font-size: 12px; }
  .fxrow .state { color: var(--muted); font-size: 12px; }
  .chev { color: var(--muted); font-size: 16px; line-height: 1; }
  .fxrow.all { grid-template-columns: 1fr 12px; margin-top: 4px; border-top: 1px solid var(--line); border-radius: 0 0 8px 8px; padding-top: 9px; }

  /* one effect, or all settings */
  .pane-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .pane-head h3 { margin: 0; font-size: 14px; font-weight: 600; flex: 1; }
  .note { color: var(--muted); margin: 0 0 14px; max-width: 60ch; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 26px; }
  .seg { display: flex; gap: 6px; margin: 4px 0 4px; }
  #presets { margin: 0 0 12px; }
  .seg button { flex: 1; padding: 6px 4px; }
  .seg-hint { color: var(--muted); font-size: 12px; margin-bottom: 14px; min-height: 17px; }
  .sec { margin-bottom: 14px; }
  .sec h4 { display: flex; justify-content: space-between; align-items: center; margin: 0 0 8px; font-size: 12px;
    font-weight: 600; padding-top: 10px; border-top: 1px solid var(--line); }
  .sec:first-of-type h4 { border-top: 0; padding-top: 0; }
  .tools { display: flex; gap: 8px; margin: 0 0 14px; }

  footer { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-top: 1px solid var(--line); }
  .status { flex: 1; min-width: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status.ok { color: var(--good); } .status.err { color: var(--warn); } .status.hint { color: var(--text); }
  button.compare.held { background: var(--accent); color: var(--accent-ink); }

  /* a window too narrow for two columns: one column that scrolls */
  @media (max-width: 760px) {
    main { display: block; overflow: auto; }
    .col { overflow: visible; }
    .left { border-right: 0; border-bottom: 1px solid var(--line); }
    .grid2 { grid-template-columns: 1fr; }
    footer { flex-wrap: wrap; }
    .status { flex-basis: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>Glass Tuner</h1>
  <div class="master"><span>Glass</span><span class="sw" id="master" role="switch" title="Liquid Glass on terminals"></span></div>
</header>

<main>
  <div class="col left">
    <h2>Preset</h2>
    <div class="seg" id="presets"></div>
    <h2>Feel</h2>
    <div id="feel"></div>
    <h2>Looks <span class="dirty" id="dirty"></span><span class="grow"></span>
      <button class="small" id="look-update" title="Overwrite the selected look with the current sliders">Update</button>
      <button class="small" id="look-delete" title="Delete the selected look">Delete</button></h2>
    <div class="chips" id="looks"></div>
    <div class="looks-new">
      <input type="text" id="look-name" maxlength="40" placeholder="Name these settings">
      <button id="look-new">Save as look</button>
    </div>
  </div>
  <div class="col right" id="pane"></div>
</main>

<footer>
  <div class="status" id="status"></div>
  <button class="compare" id="compare" title="Hold to see your terminals without the glass">Hold to compare</button>
  <button id="test" title="A floating terminal above the Tuner to see the glass on">Test window</button>
  <button id="revert" title="Back to your saved settings">Revert</button>
  <button class="primary" id="save">Save</button>
</footer>
<script>
// Left: the four sliders that change how the glass feels, and saved looks.
// Right: the effects as an on/off list; a name opens its settings in the same
// place, and "All settings" holds every glass setting. A key can sit in more
// than one place (Frost is the Blur slider); the copies stay in step.
const FEEL = [
  ['blur_strength', 'Frost', 'How milky the glass is. Less shows the bend better'],
  ['refraction_strength', 'Bend', 'How hard the thick edges bend what is behind'],
  ['chromatic_aberration', 'Rainbow', 'Colour split where the glass bends'],
  ['foot_alpha', 'Darkness', 'Terminal background: 0 = pure glass, 1 = solid'],
];

// Presets: one click sets the whole look (Feel, rim, lens and which effects
// run). Clear = the shipped glass with less rainbow; tried side by side on a test terminal.
const FX_OFF = { light_on: false, oil_on: false, parallax_on: false, glow_on: false, materialize_on: false, drift_on: false, liquid_on: false };
const PRESETS = [
  { name: 'Clear', hint: 'See-through glass with a strong bend and little rainbow',
    set: { blur_strength: 0.2, refraction_strength: 4.5, chromatic_aberration: 0.8, foot_alpha: 0.25,
           edge_thickness: 0.07, lens_distortion: 7.8, specular_strength: 3, fresnel_strength: 0.09, adaptive_dim: 0.3,
           ...FX_OFF, light_on: true, parallax_on: true, glow_on: true, materialize_on: true } },
  { name: 'Frosted', hint: 'Milky glass with a gentle bend. Calm and easy to read',
    set: { blur_strength: 2.6, refraction_strength: 2, chromatic_aberration: 0.5, foot_alpha: 0.4,
           edge_thickness: 0.08, lens_distortion: 3, specular_strength: 1.5, fresnel_strength: 0.6, adaptive_dim: 0.4,
           ...FX_OFF, light_on: true, glow_on: true, materialize_on: true } },
  { name: 'Subtle', hint: 'A mostly solid background, a faint bend, nothing moving. For focused work',
    set: { blur_strength: 1.2, refraction_strength: 1.5, chromatic_aberration: 0.3, foot_alpha: 0.7,
           edge_thickness: 0.05, lens_distortion: 1.5, specular_strength: 1, fresnel_strength: 0.3, adaptive_dim: 0.5,
           ...FX_OFF } },
  { name: 'Vivid', hint: 'The strongest bend and rainbow, with the light and oil effects on',
    set: { blur_strength: 0.15, refraction_strength: 5, chromatic_aberration: 2.3, foot_alpha: 0.2,
           edge_thickness: 0.09, lens_distortion: 7.8, specular_strength: 4.5, fresnel_strength: 1.2, adaptive_dim: 0.3,
           ...FX_OFF, light_on: true, oil_on: true, parallax_on: true, glow_on: true, materialize_on: true, drift_on: true } },
];

// Liquid Touch styles: each sets the whole feel at once (Strength and Brush size
// stay yours). Flowing = the plugin's defaults. Tuned side by side on one stroke.
const LIQUID_STYLES = [
  { name: 'Calm', hint: 'A soft, slow warp. Little swirl, few glints, dries quickly',
    set: { liquid_force: 0.9, liquid_swirl: 3, liquid_ripple: 0.5, liquid_drag: 0.6, liquid_return: 1.6,
           liquid_refraction: 2.0, liquid_glints: 1.0, liquid_steps: 20, liquid_color: 0.4, liquid_fade: 1.4 } },
  { name: 'Flowing', hint: 'Glossy liquid that swirls and catches the light',
    set: { liquid_force: 1.25, liquid_swirl: 8, liquid_ripple: 1.0, liquid_drag: 1.0, liquid_return: 1.1,
           liquid_refraction: 2.6, liquid_glints: 1.5, liquid_steps: 20, liquid_color: 0.7, liquid_fade: 0.9 } },
  { name: 'Wild', hint: 'Thick, shiny and swirly, with strong rainbow edges. Lingers longer',
    set: { liquid_force: 1.8, liquid_swirl: 16, liquid_ripple: 1.3, liquid_drag: 1.3, liquid_return: 0.8,
           liquid_refraction: 3.2, liquid_glints: 2.2, liquid_steps: 30, liquid_color: 1.3, liquid_fade: 0.6 } },
];

// needs: 'light' = the HyprGlass Liquid fork, 'liquid' = a plugin with Liquid Touch
const EFFECTS = [
  { title: 'Liquid Touch', action: 'liquid_on', needs: 'liquid', main: 'liquid_amount', styles: LIQUID_STYLES,
    sub: 'Stir the glass with your pointer',
    note: 'Moving the pointer stirs a thin clear liquid on the glass under it. It only runs while you stir. After “Viscous Liquid” by Sabo Sugi.',
    rows: [
      ['liquid_radius', 'Brush size', 'Size of the stirred spot, px'],
      ['liquid_color', 'Rainbow', 'Colour split where the liquid curves'],
      ['liquid_fade', 'Dries', 'Higher = the liquid dries sooner'],
    ]},
  { title: 'Light follows you', action: 'light_on', needs: 'light', main: 'light_strength',
    sub: 'The rim lights up toward your pointer',
    note: 'The rim lights up where it faces a light that leans toward your pointer.',
    rows: [
      ['light_cursor', 'Follows cursor', 'How far the light leans toward your pointer'],
      ['light_lag', 'Cursor smoothing', 'Shared with Parallax: seconds to catch up with your pointer. 0 = instant'],
      ['light_x', 'Light left / right', 'Across all monitors: 0 = left edge, 1 = right edge'],
      ['light_y', 'Light height', '0 = top of the screens, below 0 = above them. Closer = highlights move more'],
      ['light_sharpness', 'Highlight focus', 'Higher = a tighter, shinier highlight'],
      ['light_width', 'Depth', 'How far into the glass the rim light reaches, px'],
      ['light_far', 'Back reflection', 'Soft light on the side facing away'],
      ['light_bend', 'Bend', 'How much the glass bends where it faces the light. 0 = light only'],
      ['light_inactive', 'Unfocused windows', 'How much light unfocused windows catch'],
    ], extra: ['light_color', 'Light colour'] },
  { title: 'Oil film', action: 'oil_on', needs: 'light', main: 'oil_amount',
    sub: 'Slow rainbow swirls, like oil on water',
    note: 'Slow iridescent swirls on the glass, like oil on water.',
    rows: [
      ['oil_speed', 'Flow speed', 'How fast the film flows'],
      ['oil_scale', 'Swirl size', 'px'],
      ['oil_color', 'Colour', '0 = clear sheen, 1 = full rainbow film'],
      ['oil_warp', 'Ripple', 'How much the film ripples the view behind the glass'],
      ['oil_inactive', 'Unfocused windows', '0 = only the focused window flows (lighter on the GPU)'],
      ['oil_fps', 'Smoothness', 'Redraws per second while it flows. Lower = lighter on the GPU'],
    ]},
  { title: 'Parallax tilt', action: 'parallax_on', needs: 'light', main: 'parallax_strength',
    sub: 'The view shifts as your pointer moves',
    note: 'The view behind the glass shifts as your pointer moves, like tilting thick glass.',
    rows: [
      ['parallax_depth', 'Thickness', 'Extra shift toward the rim, so the glass reads as thick'],
      ['light_lag', 'Cursor smoothing', 'Shared with Light: seconds to catch up with your pointer. 0 = instant'],
    ]},
  { title: 'Click glow', action: 'glow_on', needs: 'light', main: 'glow_strength',
    sub: 'A ring of light when you click a window',
    note: 'Clicking a window sends a ring of light through its glass.',
    rows: [
      ['glow_duration', 'Duration', 'Seconds to spread and fade'],
      ['glow_spread', 'Spread', 'How far it travels (share of the window)'],
      ['glow_ring', 'Ring width', 'px'],
      ['glow_flex', 'Flex', 'How much the glass flexes as the ripple passes. 0 = light only'],
    ]},
  { title: 'Materialize', action: 'materialize_on', needs: 'light',
    sub: 'New windows bend in instead of fading',
    note: 'New windows appear by bending in, not fading.',
    rows: [['materialize_duration', 'Duration', 'Seconds']] },
  { title: 'Drift', action: 'drift_on', needs: 'light',
    sub: 'The light wanders slowly on its own',
    note: 'The light slowly wanders on its own, so highlights creep round the rims.',
    rows: [
      ['light_drift', 'Amount', 'How far the light wanders'],
      ['light_drift_period', 'Time', 'Seconds for one slow wander'],
    ]},
];

// All settings: every glass and window setting.
const SECTIONS = [
  { title: 'Thick glass rim', rows: [
    ['edge_thickness', 'Rim width', 'How wide the thick glass edge is (share of the window size)'],
    ['refraction_strength', 'Edge bend', 'How hard it bends at the edges. Below 0 bends outward'],
    ['chromatic_aberration', 'Rainbow fringe', 'Colour split where the glass bends'],
    ['fresnel_strength', 'Edge glow', 'Light caught all around the rim'],
    ['specular_strength', 'Top highlight', 'Shine along the top of the rim'],
  ]},
  { title: 'Edge shape', edge: true, rows: [
    ['refraction_spread', 'Bend depth', '1 = bends across the whole window, 0 = only a rim with a flat middle'],
    ['refraction_flow', 'Bend along edges', '0 = pulls toward the middle, 1 = slides along the edges'],
    ['fresnel_tint', 'Edge glow colour', '0 = white, 1 = picks up the colours behind the glass'],
    ['specular_angle', 'Highlight direction', 'Where the top highlight comes from: 0 top, 90 right, 180 bottom, 270 left'],
    ['self_sample', 'Own text in the glass', "Mixes the terminal's own content into the glass behind it. 0 = off"],
  ]},
  { title: 'Glass edge line', edge: true, rows: [
    ['bevel_strength', 'Line', 'A thin lit line along the glass edge. 0 = none'],
    ['bevel_size', 'Thickness', 'px'],
    ['bevel_angle', 'Light direction', '0 top, 90 right, 180 bottom, 270 left'],
    ['bevel_shadow', 'Shadow side', 'Darker on the side away from the light'],
    ['bevel_tint', 'Colour from behind', '0 = its own colour, 1 = the colours behind the glass'],
  ], extra: ['bevel_color', 'Line colour'] },
  { title: 'Glass body', rows: [
    ['lens_distortion', 'Lens dome', 'Magnifies the middle like a lens'],
  ]},
  { title: 'Blur', rows: [
    ['blur_strength', 'Blur', 'Less blur makes the bending easier to see'],
    ['blur_iterations', 'Blur passes', 'Smoothness of the blur'],
  ]},
  { title: 'Tone', rows: [
    ['brightness', 'Brightness', ''],
    ['contrast', 'Contrast', ''],
    ['adaptive_dim', 'Dim bright spots', 'Keeps text readable over bright wallpaper'],
    ['adaptive_boost', 'Lift dark spots', 'Milky glass over dark wallpaper'],
  ]},
  { title: 'Colour', rows: [
    ['saturation', 'Saturation', 'Colour of the wallpaper through the glass'],
    ['vibrancy', 'Vibrancy', 'Extra pop for colourful areas'],
    ['vibrancy_darkness', 'Vibrancy in shadows', ''],
    ['tint_strength', 'Tint strength', 'How much of the tint colour is mixed in'],
    ['glass_opacity', 'Glass amount', 'Overall strength of the whole effect'],
  ], extra: ['tint', 'Tint colour'] },
  { title: 'Text', rows: [
    ['text_boost', 'Text brightness', "Brightens your theme's own text colour toward white, so it still follows theme changes. 0 = exactly the theme colour. Updates open terminals"],
  ], choices: [['font_weight', 'Font weight', ['regular', 'medium', 'semibold', 'bold'], 'Heavier letters hold up better on glass. New terminals, after Save']],
    toggles: [['bold_bright', 'Bold text in bright colours', 'New terminals, after Save']] },
  { title: 'Window look', rows: [
    ['foot_alpha', 'Terminal background', '0 = pure glass, 1 = solid black (updates open terminals)'],
    ['foot_pad', 'Text padding', 'Space between text and the window edge, so text stays off the rim. New terminals after Save; the test window uses it'],
    ['rounding', 'Corner rounding', ''],
    ['gaps_in', 'Gap between windows', ''],
    ['gaps_out', 'Gap to screen edge', ''],
  ], toggles: [['shadow', 'Shadows', '']] },
  { title: 'Outer line (flat border)', rows: [
    ['border_size', 'Line thickness', 'A thin lit lip outside the glass. 0 = none'],
    ['rim_lit', 'Lit corner', 'Brightness where the light hits'],
    ['rim_side', 'Sides', 'Brightness along the edges in between'],
    ['rim_far', 'Far corner', 'Soft reflection on the opposite corner'],
    ['rim_angle', 'Light direction', '45 top-left, 135 top-right, 225 bottom-right, 315 bottom-left'],
    ['rim_inactive', 'Unfocused windows', 'How much rim unfocused windows keep'],
  ], extra: ['rim_color', 'Rim colour'],
    toggles: [['glass_border', 'Lit white line', 'Off = neon gradient'], ['border_spin', 'Spin the light around', '']] },
];

let S = {}, SAVED = {}, META = {}, timer = null, compare = false;
let VIEW = 'effects';            // 'effects', 'all', or an effect's action key
const $ = id => document.getElementById(id);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const range = k => (META.glass[k] || META.look[k]);
const isInt = k => ['specular_angle', 'bevel_angle', 'oil_scale', 'oil_fps', 'light_width', 'glow_ring', 'foot_pad', 'blur_iterations', 'tint_strength', 'rounding', 'gaps_in', 'gaps_out', 'border_size', 'rim_angle', 'liquid_radius', 'liquid_steps'].includes(k);
function fmt(k, v) { return isInt(k) ? String(Math.round(v)) : Number(v).toFixed(k === 'edge_thickness' ? 3 : 2); }
function push() {
  markDirty();
  clearTimeout(timer);
  timer = setTimeout(() => fetch('/apply', { method: 'POST', body: JSON.stringify({ state: S, compare }) }), 40);
}

// the bottom line: the last message, or what the control under the pointer does
const DEFAULT_STATUS = 'Changes show live. Double-click a slider to reset it. Nothing is kept until you Save.';
let STATUS = { msg: DEFAULT_STATUS, cls: '' };
function status(msg, cls = '') { STATUS = { msg, cls }; showStatus(); }
function showStatus(hint) {
  const s = $('status');
  if (hint) { s.textContent = hint; s.className = 'status hint'; }
  else { s.textContent = STATUS.msg; s.className = 'status ' + STATUS.cls; }
}
function explain(node, label, hint) {
  if (!hint) return;
  node.onmouseenter = () => showStatus(`${label}: ${hint}`);
  node.onmouseleave = () => showStatus();
}

// every control showing a key, so the copies of it stay in step
let BOUND = {};
function bind(k, refresh) { (BOUND[k] ||= []).push(refresh); }
function changed(k, except) { for (const f of BOUND[k] || []) if (f !== except) f(); }

function slider(k) {
  const [lo, hi] = range(k);
  const inp = document.createElement('input');
  Object.assign(inp, { type: 'range', min: lo, max: hi, step: isInt(k) ? 1 : (hi - lo) / 200, value: S[k] });
  return inp;
}
// showHint: the hint sits under the label (Feel); elsewhere it shows in the bottom line on hover
function sliderRow(k, label, hint, { showHint = false, onMove } = {}) {
  const r = el('div', 'row', `<div class="top"><label>${label}</label><span class="val"></span></div>`
    + (showHint && hint ? `<div class="hint">${hint}</div>` : ''));
  if (!showHint) explain(r, label, hint);
  const inp = slider(k);
  const val = r.querySelector('.val');
  const refresh = () => { inp.value = S[k]; val.textContent = fmt(k, S[k]); };
  bind(k, refresh);
  inp.oninput = () => { S[k] = parseFloat(inp.value); val.textContent = fmt(k, S[k]); changed(k, refresh); onMove && onMove(); push(); };
  inp.ondblclick = () => { S[k] = META.defaults[k]; refresh(); changed(k, refresh); push(); };
  refresh(); r.appendChild(inp);
  return r;
}
function colorRow(key, label) {
  const r = el('div', 'check', `<label>${label}</label>`);
  const c = Object.assign(document.createElement('input'), { type: 'color', value: '#' + S[key] });
  c.oninput = () => { S[key] = c.value.slice(1); push(); };
  r.appendChild(c);
  return r;
}
function fillGrid(grid, sec) {
  for (const [k, label, hint] of sec.rows) grid.appendChild(sliderRow(k, label, hint));
  for (const [key, label, options, hint] of sec.choices || []) {
    const r = el('div', 'check', `<label>${label}</label>`);
    explain(r, label, hint);
    const sel = document.createElement('select');
    for (const o of options) sel.add(new Option(o[0].toUpperCase() + o.slice(1), o));
    sel.value = S[key];
    sel.onchange = () => { S[key] = sel.value; push(); };
    r.appendChild(sel); grid.appendChild(r);
  }
  if (sec.extra) grid.appendChild(colorRow(...sec.extra));
  for (const [k, label, hint] of sec.toggles || []) {
    const r = el('div', 'check', `<label>${label}</label>`);
    explain(r, label, hint);
    const c = Object.assign(document.createElement('input'), { type: 'checkbox', checked: S[k] });
    c.onchange = () => { S[k] = c.checked; push(); };
    r.appendChild(c); grid.appendChild(r);
  }
}
const sectionKeys = sec => sec.rows.map(r => r[0]).concat((sec.toggles || []).map(t => t[0]), (sec.choices || []).map(c => c[0]),
  sec.extra ? [sec.extra[0]] : [], sec.action ? [sec.action] : [], sec.main ? [sec.main] : [],
  sec.styles ? Object.keys(sec.styles[0].set) : []);
function revertButton(keys, label) {
  const b = el('button', 'small', 'Revert');
  b.title = 'Put this back to your saved values';
  b.onclick = e => {
    e.stopPropagation();
    for (const k of keys) S[k] = SAVED[k];
    build(); push(); status(`${label} back to saved`, 'ok');
  };
  return b;
}

function switchEl(on, title, flip) {
  const sw = el('span', 'sw' + (on ? ' on' : ''));
  sw.setAttribute('role', 'switch'); sw.setAttribute('aria-checked', on ? 'true' : 'false'); sw.title = title;
  sw.onclick = e => { e.stopPropagation(); flip(); };
  return sw;
}
function setSwitch(sw, on) { sw.classList.toggle('on', on); sw.setAttribute('aria-checked', on ? 'true' : 'false'); }
function flipEffect(fx) {
  S[fx.action] = !S[fx.action];
  changed(fx.action);
  status(`${fx.title}: ${S[fx.action] ? 'on' : 'off'}`);
}
function effectSwitch(fx) {
  const sw = switchEl(S[fx.action], 'Turn on or off', () => { flipEffect(fx); push(); });
  bind(fx.action, () => setSwitch(sw, !!S[fx.action]));
  return sw;
}
const near = (a, b) => typeof b === 'boolean' ? !!a === b : Math.abs(a - b) < 1e-3;
const styleNow = fx => fx.styles.find(st => Object.entries(st.set).every(([k, v]) => near(S[k], v)));

// Style buttons: one sets every key in its `set`; the matching one stays lit
// until a slider moves away from it.
function styleRow(fx) {
  const wrap = el('div', '', '<div class="top"><label>Style</label></div>');
  const seg = el('div', 'seg'), hint = el('div', 'seg-hint');
  const refresh = () => {
    const cur = styleNow(fx);
    for (const b of seg.children) b.classList.toggle('on', !!cur && b.textContent === cur.name);
    hint.textContent = cur ? cur.hint : 'Your own mix';
  };
  for (const st of fx.styles) {
    const b = el('button', '', st.name);
    b.onclick = () => {
      Object.assign(S, st.set);
      for (const k of Object.keys(st.set)) changed(k, refresh);
      if (!S[fx.action]) flipEffect(fx);
      refresh(); push(); status(`${fx.title}: ${st.name}`);
    };
    seg.appendChild(b);
  }
  for (const k of Object.keys(fx.styles[0].set)) bind(k, refresh);
  refresh();
  wrap.append(seg, hint);
  return wrap;
}

function setView(v) { VIEW = v; build(); $('pane').scrollTop = 0; }

function effectsView(pane) {
  pane.appendChild(el('h2', '', 'Effects'));
  const effects = EFFECTS.filter(fx => META[fx.needs]);
  if (!effects.length) pane.appendChild(el('p', 'note', 'Effects need the HyprGlass Liquid build of the plugin.'));
  for (const fx of effects) {
    const row = el('div', 'fxrow');
    const txt = el('div', '', `<b>${fx.title}</b><span class="sub">${fx.sub}</span>`);
    const state = el('span', 'state');
    if (fx.styles) {
      const refresh = () => { const cur = styleNow(fx); state.textContent = cur ? cur.name : 'Your mix'; };
      for (const k of Object.keys(fx.styles[0].set)) bind(k, refresh);
      refresh();
    }
    row.append(effectSwitch(fx), txt, state, el('span', 'chev', '›'));
    row.onclick = () => setView(fx.action);
    pane.appendChild(row);
  }
  const all = el('div', 'fxrow all', '<div><b>All settings</b><span class="sub">Rim, tone, colour, text, window, border</span></div><span class="chev">›</span>');
  all.onclick = () => setView('all');
  pane.appendChild(all);
}

function head(title, ...right) {
  const h = el('div', 'pane-head');
  const back = el('button', 'small', '‹ Effects');
  back.onclick = () => setView('effects');
  h.append(back, el('h3', '', title), ...right);
  return h;
}

function effectView(pane, fx) {
  pane.appendChild(head(fx.title, revertButton(sectionKeys(fx), fx.title), effectSwitch(fx)));
  pane.appendChild(el('p', 'note', fx.note));
  if (fx.styles) pane.appendChild(styleRow(fx));
  const grid = el('div', 'grid2');
  // moving the strength of an off effect turns it on
  if (fx.main) grid.appendChild(sliderRow(fx.main, 'Strength', 'How strong the effect is',
    { onMove: () => { if (!S[fx.action]) flipEffect(fx); } }));
  fillGrid(grid, fx);
  pane.appendChild(grid);
}

function allView(pane) {
  pane.appendChild(head('All settings'));
  const tools = el('div', 'tools');
  const wall = el('button', '', 'Next wallpaper');
  wall.onclick = () => { fetch('/wallpaper', { method: 'POST', body: '{}' }); status('Next wallpaper'); };
  tools.append(wall);
  pane.appendChild(tools);
  for (const sec of SECTIONS) {
    if (sec.edge && !META.edge) continue;     // plugin older than hyprglass v0.9.0
    const box = el('div', 'sec');
    const h4 = el('h4', '', `<span>${sec.title}</span>`);
    h4.appendChild(revertButton(sectionKeys(sec), sec.title));
    const grid = el('div', 'grid2');
    fillGrid(grid, sec);
    box.append(h4, grid);
    pane.appendChild(box);
  }
}

// the lit preset is the one every value still matches; none once a slider moves
function presetRow() {
  const box = $('presets'); box.innerHTML = '';
  const matches = st => Object.entries(st.set).every(([k, v]) => near(S[k], v));
  const refresh = () => { for (const b of box.children) b.classList.toggle('on', matches(PRESETS.find(p => p.name === b.textContent))); };
  for (const st of PRESETS) {
    const b = el('button', '', st.name);
    explain(b, st.name, st.hint);
    b.onclick = () => { Object.assign(S, st.set); build(); push(); status(`${st.name}: ${st.hint}`); };
    box.appendChild(b);
  }
  for (const k of Object.keys(PRESETS[0].set)) bind(k, refresh);
  refresh();
}

function build() {
  BOUND = {};
  setSwitch($('master'), !!S.glass_on);
  presetRow();
  const feel = $('feel'); feel.innerHTML = '';
  for (const [k, label, hint] of FEEL) feel.appendChild(sliderRow(k, label, hint, { showHint: true }));
  const pane = $('pane'); pane.innerHTML = '';
  const fx = EFFECTS.find(f => f.action === VIEW && META[f.needs]);
  if (fx) effectView(pane, fx);
  else if (VIEW === 'all') allView(pane);
  else effectsView(pane);
}
$('master').onclick = () => {
  S.glass_on = !S.glass_on; build(); push();
  status(`Liquid Glass ${S.glass_on ? 'on' : 'off'}`);
};

// ---------------- named looks ----------------
let LOOKS = { looks: {}, active: null }, SEL = '';
const same = (a, b) => a && b && Object.keys(b).every(k => a[k] === b[k]);
function markDirty() {
  $('dirty').textContent = SEL && !same(S, LOOKS.looks[SEL]) ? '• changed' : '';
  $('look-update').hidden = $('look-delete').hidden = !SEL;
}
function renderLooks(keep) {
  SEL = keep in LOOKS.looks ? keep : '';
  const box = $('looks'); box.innerHTML = '';
  const names = Object.keys(LOOKS.looks).sort();
  if (!names.length) box.appendChild(el('span', 'hint', 'No saved looks yet.'));
  for (const name of names) {
    const b = el('button', 'chip' + (name === SEL ? ' on' : ''));
    b.textContent = name;
    if (name === LOOKS.active) { b.appendChild(el('span', 'tag', 'saved')); b.title = 'The look your saved settings came from'; }
    b.onclick = () => {
      S = { ...S, ...LOOKS.looks[name] }; renderLooks(name); build(); push();
      status(`Loaded "${name}". Press Save to keep it.`);
    };
    box.appendChild(b);
  }
  markDirty();
}
async function lookPost(path, body) {
  const r = await fetch(path, { method: 'POST', body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) { status(j.error || 'Something went wrong', 'err'); return null; }
  LOOKS = j; return j;
}
$('look-new').onclick = async () => {
  const name = $('look-name').value.trim();
  if (!name) return status('Type a name first', 'err');
  if (name in LOOKS.looks && !confirm(`"${name}" exists. Overwrite it?`)) return;
  if (await lookPost('/looks/save', { name, state: S })) { $('look-name').value = ''; renderLooks(name); status(`Saved look "${name}"`, 'ok'); }
};
$('look-name').onkeydown = e => { if (e.key === 'Enter') $('look-new').click(); };
$('look-update').onclick = async () => {
  if (await lookPost('/looks/save', { name: SEL, state: S })) { renderLooks(SEL); status(`Updated "${SEL}"`, 'ok'); }
};
$('look-delete').onclick = async () => {
  const name = SEL;
  if (!confirm(`Delete the look "${name}"?`)) return;
  if (await lookPost('/looks/delete', { name })) { renderLooks(''); status(`Deleted "${name}"`, 'ok'); }
};

// ---------------- bottom bar ----------------
function setTest(open) {
  $('test').classList.toggle('on', !!open);
  $('test').textContent = open ? 'Hide test window' : 'Test window';
}
$('test').onclick = async () => {
  const r = await (await fetch('/test-window', { method: 'POST', body: JSON.stringify({ state: S }) })).json();
  setTest(r.open);
  status(r.open ? 'Opening the test window above the Tuner…' : 'Test window closed');
};
const cmp = $('compare');
const hold = on => { compare = on; cmp.classList.toggle('held', on); push(); };
cmp.onmousedown = () => hold(true);
addEventListener('mouseup', () => compare && hold(false));
$('revert').onclick = async () => {
  const r = await (await fetch('/revert', { method: 'POST', body: '{}' })).json();
  S = r.state; SAVED = { ...r.state }; build(); markDirty(); status('Back to your saved settings', 'ok');
};
$('save').onclick = async () => {
  status('Saving…');
  const look = SEL && same(S, LOOKS.looks[SEL]) ? SEL : null;
  const r = await (await fetch('/save', { method: 'POST', body: JSON.stringify({ state: S, look }) })).json();
  SAVED = { ...S };
  LOOKS = await (await fetch('/looks')).json(); renderLooks(SEL);
  r.errors ? status('Saved, but Hyprland reported: ' + r.errors, 'err') : status('Saved to liquid_glass.lua and foot.ini', 'ok');
};

async function load() {
  const r = await (await fetch('/state')).json();
  S = r.state; SAVED = { ...r.state }; META = r.meta; build(); setTest(r.test);
  LOOKS = await (await fetch('/looks')).json();
  renderLooks(LOOKS.active || '');
  showStatus();
}
// the bar button turns the glass on and off while the tuner is open: follow it,
// so a later slider move or Save doesn't switch it back; and keep the test
// window button right when that window is closed by hand
setInterval(async () => {
  if (document.hidden || !('glass_on' in SAVED)) return;
  try {
    const r = await (await fetch('/state')).json();
    if (r.state.glass_on !== SAVED.glass_on) { S.glass_on = SAVED.glass_on = r.state.glass_on; build(); }
    setTest(r.test);
  } catch (e) {}
}, 2000);
load();
</script>
</body>
</html>
